name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [android-arm, android-arm64, android-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - run: flutter pub get

      - name: Build APK (${{ matrix.target }})
        run: flutter build apk --release --target-platform=${{ matrix.target }}

      - name: Upload APK (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: akat-panel-${{ matrix.target }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.target }}-release.apk
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: akat-panel-*
          merge-multiple: true
          path: artifacts

      - name: Rename APKs
        run: |
          for f in artifacts/*.apk; do
            base=$(basename "$f")
            arch=$(echo "$base" | sed 's/app-\(.*\)-release.apk/\1/')
            mv "$f" "artifacts/akat-panel-${{ github.ref_name }}-${arch}.apk"
          done
          ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}